services:
  - type: web
    name: shree-overseas-app
    env: node
    region: oregon
    plan: free # Change to paid for production (starter, standard, etc.)
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    # Add your environment variables here (database URLs, API keys, etc.)
    # Example:
    # - key: DATABASE_URL
    #   fromDatabase:
    #     name: shree-overseas-db
    #     property: connectionString
